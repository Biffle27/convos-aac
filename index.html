
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Convos AAC</title>

    <link rel="stylesheet" href="src/css/styles.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#121826">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Convos AAC">
</head>


<body>
    <main class="app-container">

        <header class="app-header">
            <h1>Convos AAC</h1>

            
            <div class="header-controls">
                <button id="themeButton"
                        aria-label="Toggle theme">
                    Theme
                </button>

                <button
                    id="settingsButton"
                    aria-controls="settingsPanel"
                    aria-expanded="false">
                    Settings
                </button>

                <button
                    id="editModeButton"
                    type="button"
                    aria-controls="editModePanel"
                    aria-expanded="false">
                    Edit Mode
                </button>
            </div>

        </header>

        <section id="settingsPanel"
                 class="settings-panel"
                 aria-label="Application settings"
                 hidden>

            <h2>Settings</h2>

            <div class="setting-group">
                <label for="textSizeSelect">Text Size</label>

                <select id="textSizeSelect">
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                    <option value="xl">Extra Large (XL)</option>
                    <option value="xxl">Extra Extra Large (XXL)</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="speechRate">
                    Speech Speed:
                    <span id="speechRateValue">1.0x</span>
                </label>

                <input
                    type="range"
                    id="speechRate"
                    min="0.5"
                    max="1.5"
                    step="0.1"
                    value="1"
                >
            </div>

            <div class="setting-group">
                <label for="voiceSelect">Voice</label>

                <select id="voiceSelect">
                    <option value="">Device Default</option>
                </select>

                <button id="testVoiceButton" type="button">
                    Test Voice
                </button>
            </div>
        </section>

        
        <!-- Vocabulary editing panel -->
        <section
            id="editModePanel"
            class="edit-mode-panel"
            aria-labelledby="editModeHeading"
            hidden>

            <h2 id="editModeHeading">Customize Vocabulary</h2>

            <p>
                Edit your Quick Phrases, categories, and vocabulary.
            </p>

            <div class="edit-mode-options">
                <button id="editQuickPhrasesButton" type="button">
                    Edit Quick Phrases
                </button>

                <button id="editCategoriesButton" type="button">
                    Manage Categories
                </button>

                <button id="editCategoryPhrasesButton" type="button">
                    Edit Category Phrases
                </button>
            </div>

            <div class="vocabulary-backup-section">
                <h3>Vocabulary Backup & Recovery</h3>

                <p>
                    Save a copy of your vocabulary, restore a backup,
                    or return to the original phrases.
                </p>

                <div class="vocabulary-backup-actions">
                    <button id="exportVocabularyButton" type="button">
                        Export Vocabulary
                    </button>

                    <button id="importVocabularyButton" type="button">
                        Import Vocabulary
                    </button>

                    <button id="restoreDefaultsButton" type="button">
                        Restore Defaults
                    </button>
                </div>

                <input
                    id="vocabularyImportFile"
                    type="file"
                    accept=".json,application/json"
                    aria-label="Choose vocabulary backup file"
                    hidden
                >

                <p id="vocabularyBackupStatus"
                    class="vocabulary-backup-status"
                    role="status"
                    aria-live="polite"></p>
            </div>

            <div id="editModeContent"></div>
        </section>

        <!-- NEW: Quick Phrases section -->
        <!-- This stays visible on every category screen -->

        <section id="quickPhrasesSection"
                 aria-labelledby="quickPhrasesHeading">

            <h2 id="quickPhrasesHeading">Quick Phrases</h2>

            <div class="quick-phrases-grid">

                <button class="quick-phrase-button"
                        data-phrase="Yes">
                    Yes
                </button>

                <button class="quick-phrase-button"
                        data-phrase="No">
                    No
                </button>

                <button class="quick-phrase-button"
                        data-phrase="Please wait.">
                    Please wait.
                </button>

                <button class="quick-phrase-button"
                        data-phrase="Thank you.">
                    I need help.
                </button>

            </div>
        </section>

        <!-- Existing Categories section -->

        <section class="categories-section">
            <h2>Categories</h2>

            <div class="category-grid">
                <button class="category-button"
                        data-category="conversation">
                    Conversation &amp; Social
                </button>

                <button class="category-button"
                        data-category="needs">
                    Needs &amp; Comfort
                </button>

                <button class="category-button"
                        data-category="medical">
                    Health &amp; Medical
                </button>

                <button class="category-button"
                        data-category="activities">
                    Activities &amp; Plans
                </button>

                <button class="category-button"
                        data-category="communication">
                    Communication Help
                </button>

                <button class="category-button"
                        data-category="decisions">
                    Decisions &amp; Independence
                </button>
            </div>

            <div id="phraseContainer"
                 class="phrase-container"
                 hidden>
            </div>
        </section>

        <!-- Existing message section -->

        <section class="message-section">
            <h2>Your Message</h2>

            <textarea
                id="messageInput"
                placeholder="Type your message here..."
                rows="4"
                aria-label="Your message"
            ></textarea>

            <div class="message-controls">
                <button id="speakButton"
                        class="primary-button">
                    Speak
                </button>

                <button id="stopButton">
                    Stop
                </button>

                <button id="clearButton">
                    Clear
                </button>
            </div>
        </section>

    </main>

    <script src="src/js/settings.js"></script>
    <script src="src/js/speech.js"></script>
    <script src="src/js/phrases.js"></script>
    <script src="src/js/customization.js"></script>
    <script src="src/js/vocabulary-backup.js"></script>
    <script src="src/js/main.js"></script>
</body>
</html>
